spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: ams
    password: ams_password
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect
  sql:
    init:
      mode: never

logging:
  level:
    com.ams: DEBUG
    org.springframework.security: DEBUG
