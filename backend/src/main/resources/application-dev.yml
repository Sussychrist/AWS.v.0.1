spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: ams
    password: ${DB_PASSWORD:ams_password}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect

ams:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-in-production}
    expiration-ms: 28800000  # 8 hours
  upload:
    root-path: ${AMS_UPLOAD_ROOT_PATH:./uploads}
