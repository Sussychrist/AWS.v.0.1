spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.OracleDialect

ams:
  jwt:
    secret: ${AMS_JWT_SECRET}
    expiration-ms: 28800000  # 8 hours
  upload:
    root-path: ${AMS_UPLOAD_ROOT_PATH:/var/ams/uploads}

logging:
  level:
    com.ams: INFO
    org.springframework.security: WARN
