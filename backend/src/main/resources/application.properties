# AMS Backend Configuration

# Server
server.port=8080

# Database - Oracle
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=ams
spring.datasource.password=ams123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# JWT Configuration
ams.jwt.secret=ams-jwt-secret-key-must-be-at-least-32-characters-long-for-hs256
ams.jwt.expiration=28800

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# Upload root path
ams.upload.root-path=./uploads

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
